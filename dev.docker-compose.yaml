services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "1000:1000"
    ports:
      - "3001:3000"
      - "4983:4983"
    environment:
      CI: "true"
    command: sh -c "pnpm install && pnpm turbo -F @repo/server -F @repo/schemas dev"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

volumes:
  node_modules: